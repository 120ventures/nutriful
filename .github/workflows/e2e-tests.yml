name: Unit and E2E tests

on:
  pull_request:
    branches: [ develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: pnpm/action-setup@v4
      with:
        version: latest

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run unit tests (Vitest)
      run: pnpm exec vitest run
        
    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest
      
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
      
    - name: Start Supabase local instance
      run: |
        supabase start
        sb_status=$(supabase status -o json)
        api_url=$(echo "$sb_status" | jq -r '.API_URL')
        anon_key=$(echo "$sb_status" | jq -r '.ANON_KEY')
        service_role_key=$(echo "$sb_status" | jq -r '.SERVICE_ROLE_KEY')
        echo "VITE_SUPABASE_URL=\"$api_url\"" > .env.test
        echo "VITE_SUPABASE_PUBLISHABLE_KEY=\"$anon_key\"" >> .env.test
        echo "SUPABASE_SERVICE_ROLE_KEY=\"$service_role_key\"" >> .env.test
      
    - name: Run Playwright tests
      run: pnpm exec playwright test
      env:
        CI: true
        
    - name: Stop Supabase
      if: always()
      run: supabase stop
        
